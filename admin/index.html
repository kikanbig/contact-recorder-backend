<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 Век - Административная панель</title>
    <style>
        :root {
            --bg-main: #18181b;
            --bg-card: #23232a;
            --bg-header: #23232a;
            --bg-modal: #23232a;
            --color-primary: #6366f1;
            --color-secondary: #a1a1aa;
            --color-accent: #22d3ee;
            --color-success: #22c55e;
            --color-error: #ef4444;
            --color-text: #f4f4f5;
            --color-muted: #71717a;
            --color-border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            color: var(--color-text);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: var(--bg-header);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: var(--color-primary);
            font-size: 28px;
            font-weight: 700;
        }

        .header .subtitle {
            color: var(--color-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--color-primary) 100%);
            color: var(--color-text);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            transition: transform 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-card h3 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 14px;
            font-weight: 500;
        }

        .main-content {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            padding: 12px 16px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            background: var(--bg-main);
            color: var(--color-text);
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--color-primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--color-success);
            color: #fff;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        .btn-info {
            background: var(--color-accent);
            color: #18181b;
        }

        .btn-info:hover {
            background: #06b6d4;
        }

        .btn-danger {
            background: var(--color-error);
            color: #fff;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .recordings-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
        }

        .recordings-table th,
        .recordings-table td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid var(--color-border);
        }

        .recordings-table th {
            background: var(--bg-main);
            font-weight: 600;
            color: var(--color-accent);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .recordings-table tr:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-uploaded {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .status-transcribed {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-processing {
            background: rgba(99, 102, 241, 0.2);
            color: #6366f1;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-modal);
            border-radius: 16px;
            padding: 30px;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--color-border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--color-border);
        }

        .modal-header h3 {
            color: var(--color-primary);
            font-size: 20px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--color-muted);
            padding: 5px;
            border-radius: 4px;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: var(--color-text);
            background: var(--color-border);
        }

        .transcription-content {
            line-height: 1.7;
            font-size: 16px;
            color: var(--color-text);
        }

        .speaker-segment {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid;
            background: rgba(255, 255, 255, 0.02);
        }

        .speaker-a {
            border-left-color: var(--color-primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .speaker-b {
            border-left-color: var(--color-accent);
            background: rgba(34, 211, 238, 0.05);
        }

        .speaker-c {
            border-left-color: var(--color-success);
            background: rgba(34, 197, 94, 0.05);
        }

        .speaker-label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-accent);
        }

        .timestamp {
            font-size: 12px;
            color: var(--color-muted);
            margin-left: 10px;
            font-weight: 400;
        }

        .dialog-stats {
            background: var(--bg-main);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--color-border);
        }

        .dialog-stats h4 {
            color: var(--color-accent);
            margin-bottom: 15px;
            font-size: 16px;
        }

        .speaker-stats {
            background: rgba(99, 102, 241, 0.1);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--color-text);
            border-left: 3px solid var(--color-primary);
        }

        .segment-text {
            line-height: 1.6;
            font-size: 15px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-muted);
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--color-border);
            border-top: 3px solid var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--color-muted);
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: var(--color-text);
            font-size: 18px;
        }

        .bulk-actions {
            display: none;
            gap: 10px;
            align-items: center;
            padding: 15px;
            background: var(--bg-main);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .bulk-actions.show {
            display: flex;
        }

        .transcribe-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .model-select {
            padding: 8px 12px;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            background: var(--bg-main);
            color: var(--color-text);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: auto;
            }

            .recordings-table {
                font-size: 14px;
            }

            .recordings-table th,
            .recordings-table td {
                padding: 10px 8px;
            }

            .modal-content {
                margin: 20px;
                max-width: calc(100% - 40px);
                max-height: calc(100% - 40px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🎤 21 Век - Админ панель</h1>
                <div class="subtitle">Система транскрипции аудио с диаризацией</div>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3 id="totalRecords">-</h3>
                <p>Всего записей</p>
            </div>
            <div class="stat-card">
                <h3 id="transcribedRecords">-</h3>
                <p>Транскрибировано</p>
            </div>
            <div class="stat-card">
                <h3 id="pendingRecords">-</h3>
                <p>Ожидают транскрипции</p>
            </div>
            <div class="stat-card">
                <h3 id="totalDuration">-</h3>
                <p>Общая длительность</p>
            </div>
        </div>

        <div class="main-content">
            <div class="controls">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск по названию файла, тексту или дате...">
                <div class="transcribe-controls">
                    <select id="modelSelect" class="model-select">
                        <option value="small">Small (быстро)</option>
                        <option value="medium">Medium (качество)</option>
                        <option value="large">Large (максимум)</option>
                    </select>
                    <button class="btn btn-primary" onclick="loadRecords()">
                        🔄 Обновить
                    </button>
                </div>
            </div>

            <div class="bulk-actions" id="bulkActions">
                <span id="selectedCount">0 выбрано</span>
                <button class="btn btn-success btn-small" onclick="transcribeSelected()">
                    🎤 Транскрибировать выбранные
                </button>
                <button class="btn btn-danger btn-small" onclick="deleteSelected()">
                    🗑️ Удалить выбранные
                </button>
            </div>

            <div id="recordsContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>⏳ Загрузка записей...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для просмотра транскрипции -->
    <div id="transcriptionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Транскрипция</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalContent" class="transcription-content">
                <!-- Содержимое транскрипции -->
            </div>
        </div>
    </div>

    <script>
        let allRecords = [];
        let filteredRecords = [];
        let selectedRecords = new Set();

        // Загрузка записей при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadRecords();
            loadStats();
            
            // Поиск в реальном времени
            document.getElementById('searchInput').addEventListener('input', function() {
                filterRecords(this.value);
            });
        });

        // Загрузка статистики
        async function loadStats() {
            try {
                const response = await fetch('/api/records');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const records = await response.json();
                
                const total = records.length;
                const transcribed = records.filter(r => r.text && r.text.trim()).length;
                const pending = total - transcribed;
                const totalDuration = records.reduce((sum, r) => sum + (r.duration_seconds || 0), 0);
                
                document.getElementById('totalRecords').textContent = total;
                document.getElementById('transcribedRecords').textContent = transcribed;
                document.getElementById('pendingRecords').textContent = pending;
                document.getElementById('totalDuration').textContent = formatDuration(totalDuration);
                
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }

        // Загрузка записей с сервера
        async function loadRecords() {
            try {
                const response = await fetch('/api/records');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                allRecords = await response.json();
                filteredRecords = [...allRecords];
                renderRecords();
                loadStats();
                
            } catch (error) {
                console.error('Ошибка загрузки записей:', error);
                document.getElementById('recordsContent').innerHTML = `
                    <div class="empty-state">
                        <h3>❌ Ошибка загрузки</h3>
                        <p>Не удалось загрузить записи: ${error.message}</p>
                        <button class="btn btn-primary" onclick="loadRecords()">🔄 Попробовать снова</button>
                    </div>
                `;
            }
        }

        // Фильтрация записей
        function filterRecords(searchTerm) {
            if (!searchTerm.trim()) {
                filteredRecords = [...allRecords];
            } else {
                const term = searchTerm.toLowerCase();
                filteredRecords = allRecords.filter(record => 
                    record.filename?.toLowerCase().includes(term) ||
                    record.text?.toLowerCase().includes(term) ||
                    record.created_at?.toLowerCase().includes(term)
                );
            }
            renderRecords();
        }

        // Отображение записей
        function renderRecords() {
            const container = document.getElementById('recordsContent');
            
            if (filteredRecords.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>📭 Записи не найдены</h3>
                        <p>Пока нет записей или они не соответствуют критериям поиска.</p>
                    </div>
                `;
                return;
            }

            const tableHTML = `
                <table class="recordings-table">
                    <thead>
                        <tr>
                            <th>
                                <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                            </th>
                            <th>📁 Файл</th>
                            <th>📝 Статус</th>
                            <th>👥 Спикеров</th>
                            <th>⏱️ Длительность</th>
                            <th>📅 Дата</th>
                            <th>⚙️ Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredRecords.map(record => `
                            <tr>
                                <td>
                                    <input type="checkbox" value="${record.id}" onchange="toggleRecordSelection('${record.id}')">
                                </td>
                                <td>
                                    <strong>${record.filename || 'Неизвестно'}</strong>
                                    ${record.source === 'mobile_app' ? '<br><small style="color: var(--color-accent)">📱 Мобильное приложение</small>' : ''}
                                </td>
                                <td>
                                    <span class="status-badge ${getStatusClass(record)}">
                                        ${getStatusText(record)}
                                    </span>
                                </td>
                                <td>${record.speaker_count || 1}</td>
                                <td>${formatDuration(record.duration_seconds)}</td>
                                <td>${formatDate(record.created_at)}</td>
                                <td>
                                    ${record.text ? 
                                        `<button class="btn btn-info btn-small" onclick="viewTranscription('${record.id}')">👁️ Просмотр</button>` :
                                        `<button class="btn btn-success btn-small" onclick="transcribeRecord('${record.id}')">🎤 Транскрибировать</button>`
                                    }
                                    <button class="btn btn-danger btn-small" onclick="deleteRecord('${record.id}')">🗑️ Удалить</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHTML;
        }

        // Получение класса статуса
        function getStatusClass(record) {
            if (record.text && record.text.trim()) {
                return 'status-transcribed';
            }
            return 'status-uploaded';
        }

        // Получение текста статуса
        function getStatusText(record) {
            if (record.text && record.text.trim()) {
                return 'Транскрибировано';
            }
            return 'Загружено';
        }

        // Переключение выбора всех записей
        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('tbody input[type="checkbox"]');
            
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
                toggleRecordSelection(checkbox.value, false);
            });
            
            updateBulkActions();
        }

        // Переключение выбора записи
        function toggleRecordSelection(recordId, updateSelectAll = true) {
            if (selectedRecords.has(recordId)) {
                selectedRecords.delete(recordId);
            } else {
                selectedRecords.add(recordId);
            }
            
            if (updateSelectAll) {
                const selectAllCheckbox = document.getElementById('selectAll');
                const checkboxes = document.querySelectorAll('tbody input[type="checkbox"]');
                const checkedCount = document.querySelectorAll('tbody input[type="checkbox"]:checked').length;
                
                selectAllCheckbox.checked = checkedCount === checkboxes.length;
                selectAllCheckbox.indeterminate = checkedCount > 0 && checkedCount < checkboxes.length;
            }
            
            updateBulkActions();
        }

        // Обновление панели массовых действий
        function updateBulkActions() {
            const bulkActions = document.getElementById('bulkActions');
            const selectedCount = document.getElementById('selectedCount');
            
            if (selectedRecords.size > 0) {
                bulkActions.classList.add('show');
                selectedCount.textContent = `${selectedRecords.size} выбрано`;
            } else {
                bulkActions.classList.remove('show');
            }
        }

        // Транскрипция одной записи
        async function transcribeRecord(recordId) {
            const model = document.getElementById('modelSelect').value;
            
            // Находим кнопку и меняем её состояние
            const button = document.querySelector(`button[onclick="transcribeRecord('${recordId}')"]`);
            const originalText = button.innerHTML;
            
            try {
                // Меняем состояние кнопки
                button.innerHTML = '⏳ Транскрибируется...';
                button.disabled = true;
                button.style.opacity = '0.7';
                
                const response = await fetch(`/api/records/${recordId}/transcribe`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ model: model })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || `HTTP ${response.status}`);
                }

                const result = await response.json();
                
                // Показываем результат
                if (result.segments && result.segments.length > 0) {
                    alert(`✅ Транскрипция завершена!\n👥 Найдено спикеров: ${result.speaker_count}\n📝 Сегментов диалога: ${result.segments.length}`);
                } else {
                    alert('✅ Транскрипция завершена успешно!');
                }
                
                await loadRecords();
                
            } catch (error) {
                console.error('Ошибка транскрипции:', error);
                alert(`❌ Ошибка транскрипции: ${error.message}`);
                
                // Восстанавливаем кнопку при ошибке
                button.innerHTML = originalText;
                button.disabled = false;
                button.style.opacity = '1';
            }
        }

        // Массовая транскрипция
        async function transcribeSelected() {
            if (selectedRecords.size === 0) return;
            
            if (!confirm(`Транскрибировать ${selectedRecords.size} записей?`)) {
                return;
            }

            const model = document.getElementById('modelSelect').value;
            const button = document.querySelector('button[onclick="transcribeSelected()"]');
            const originalText = button.innerHTML;
            
            try {
                button.innerHTML = `⏳ Транскрибируется ${selectedRecords.size} записей...`;
                button.disabled = true;
                button.style.opacity = '0.7';
                
                let completed = 0;
                for (const recordId of selectedRecords) {
                    try {
                        completed++;
                        button.innerHTML = `⏳ Транскрибируется ${completed}/${selectedRecords.size}...`;
                        
                        const response = await fetch(`/api/records/${recordId}/transcribe`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ model: model })
                        });

                        if (!response.ok) {
                            const error = await response.json();
                            console.error(`Ошибка транскрипции записи ${recordId}:`, error.message);
                        }
                    } catch (error) {
                        console.error(`Ошибка транскрипции записи ${recordId}:`, error);
                    }
                }
                
                alert(`✅ Массовая транскрипция завершена!\nОбработано записей: ${completed}`);
                await loadRecords();
                
            } finally {
                button.innerHTML = originalText;
                button.disabled = false;
                button.style.opacity = '1';
                selectedRecords.clear();
                updateBulkActions();
            }
        }

        // Просмотр транскрипции
        function viewTranscription(recordId) {
            const record = allRecords.find(r => r.id === recordId);
            if (!record) return;

            const modal = document.getElementById('transcriptionModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');

            modalTitle.textContent = `📝 ${record.filename || 'Транскрипция'}`;

            let contentHTML = '';
            
            if (record.segments && record.segments.length > 0) {
                // Отображение с диаризацией
                const speakerColors = {};
                let colorIndex = 0;
                
                contentHTML = record.segments.map((segment, index) => {
                    // Назначаем цвет для каждого уникального говорящего
                    if (!speakerColors[segment.speaker]) {
                        speakerColors[segment.speaker] = String.fromCharCode(97 + (colorIndex % 3));
                        colorIndex++;
                    }
                    
                    const speakerClass = `speaker-${speakerColors[segment.speaker]}`;
                    const speakerName = segment.speaker.replace('SPEAKER_', 'Говорящий ');
                    const duration = segment.end - segment.start;
                    
                    return `
                        <div class="speaker-segment ${speakerClass}">
                            <div class="speaker-label">
                                🎤 ${speakerName}
                                <span class="timestamp">${formatTime(segment.start)} - ${formatTime(segment.end)} (${duration.toFixed(1)}с)</span>
                            </div>
                            <div class="segment-text">${segment.text}</div>
                        </div>
                    `;
                }).join('');
                
                // Добавляем статистику диалога
                const speakers = [...new Set(record.segments.map(s => s.speaker))];
                const stats = speakers.map(speaker => {
                    const speakerSegments = record.segments.filter(s => s.speaker === speaker);
                    const totalDuration = speakerSegments.reduce((sum, s) => sum + (s.end - s.start), 0);
                    const wordCount = speakerSegments.reduce((sum, s) => sum + s.text.split(' ').length, 0);
                    
                    return `
                        <div class="speaker-stats">
                            🎤 ${speaker.replace('SPEAKER_', 'Говорящий ')}: 
                            ${speakerSegments.length} сегментов, 
                            ${totalDuration.toFixed(1)}с речи, 
                            ~${wordCount} слов
                        </div>
                    `;
                }).join('');
                
                contentHTML = `
                    <div class="dialog-stats">
                        <h4>📊 Статистика диалога:</h4>
                        ${stats}
                        <hr style="margin: 15px 0; border: 1px solid var(--color-border);">
                    </div>
                    ${contentHTML}
                `;
            } else {
                // Простой текст без диаризации
                contentHTML = `<div class="speaker-segment speaker-a">
                    <div class="speaker-label">📝 Транскрипция (без диаризации)</div>
                    <div>${record.text || 'Нет текста'}</div>
                </div>`;
            }

            modalContent.innerHTML = contentHTML;
            modal.style.display = 'block';
        }

        // Закрытие модального окна
        function closeModal() {
            document.getElementById('transcriptionModal').style.display = 'none';
        }

        // Закрытие модального окна при клике вне его
        window.onclick = function(event) {
            const modal = document.getElementById('transcriptionModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Удаление записи
        async function deleteRecord(recordId) {
            if (!confirm('Вы уверены, что хотите удалить эту запись?')) {
                return;
            }

            try {
                const response = await fetch(`/api/records/${recordId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                await loadRecords();
                selectedRecords.delete(recordId);
                updateBulkActions();
                
            } catch (error) {
                console.error('Ошибка удаления записи:', error);
                alert(`Ошибка удаления записи: ${error.message}`);
            }
        }

        // Массовое удаление записей
        async function deleteSelected() {
            if (selectedRecords.size === 0) return;
            
            if (!confirm(`Вы уверены, что хотите удалить ${selectedRecords.size} записей?`)) {
                return;
            }

            try {
                const response = await fetch('/api/records/bulk-delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ids: Array.from(selectedRecords)
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                await loadRecords();
                selectedRecords.clear();
                updateBulkActions();
                
            } catch (error) {
                console.error('Ошибка массового удаления:', error);
                alert(`Ошибка массового удаления: ${error.message}`);
            }
        }

        // Форматирование даты
        function formatDate(dateString) {
            if (!dateString) return 'Неизвестно';
            
            const date = new Date(dateString);
            return date.toLocaleString('ru-RU', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Форматирование времени
        function formatTime(seconds) {
            if (!seconds) return '0:00';
            
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        // Форматирование длительности
        function formatDuration(seconds) {
            if (!seconds) return '0 сек';
            
            if (seconds < 60) {
                return `${seconds} сек`;
            } else if (seconds < 3600) {
                const minutes = Math.floor(seconds / 60);
                return `${minutes} мин`;
            } else {
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                return `${hours}ч ${minutes}м`;
            }
        }
    </script>
